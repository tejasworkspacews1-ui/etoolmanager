[build-system]
requires = ["setuptools>=68.0.0"]
build-backend = "setuptools.build_meta"

[project]
name = "etoolmanager"
version = "1.0.0"
description = "Automated tool manager for eSim: install, detect, configure, and validate external tools."
readme = "README.md"
requires-python = ">=3.11"
license = "MIT"
authors = [
    { name = "Tejas Kamble", email = "tejasksocials@gmail.com" },
]
keywords = [
    "esim",
    "fossee",
    "tool-manager",
    "automation",
    "dependency-checker",
    "cli",
]
classifiers = [
    "Development Status :: 4 - Beta",
    "Environment :: Console",
    "Intended Audience :: Developers",
    "Intended Audience :: Science/Research",
    "License :: OSI Approved :: MIT License",
    "Operating System :: OS Independent",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Topic :: Software Development :: Build Tools",
    "Topic :: System :: Installation/Setup",
]

dependencies = [
    "typer>=0.12.0",
    "rich>=13.7.0",
    "PyYAML>=6.0.1",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.0.0",
    "pytest-cov>=5.0.0",
]

[project.urls]
Homepage = "https://github.com/tejasworkspacews1-ui/etoolmanager"
Repository = "https://github.com/tejasworkspacews1-ui/etoolmanager"
Documentation = "https://github.com/tejasworkspacews1-ui/etoolmanager/blob/main/docs/architecture.md"

[project.scripts]
etoolmanager = "etoolmanager.cli.app:main"

[tool.setuptools.packages.find]
include = ["etoolmanager*"]

[tool.setuptools.package-data]
etoolmanager = ["config/*.yaml", "assets/**/*"]

[tool.pytest.ini_options]
testpaths = ["etoolmanager/tests"]
pythonpath = ["."]
addopts = "-ra --cov=etoolmanager --cov-report=term-missing --cov-fail-under=80"

[tool.coverage.run]
branch = true
source = ["etoolmanager"]
omit = [
    "etoolmanager/tests/*",
    "etoolmanager/__main__.py",
]

[tool.coverage.report]
show_missing = true
skip_covered = true